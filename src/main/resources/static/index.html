
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HomeSlice | Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>
    <h1>HomeSlice</h1>
    <p>Making shared living easier.</p>
</header>

<main>
    <section>
        <h2>Welcome Home!</h2>
        <p>Manage your household in one place.</p>
    </section>

    <section class="dashboard">
        <div class="card">
            <h3>Household</h3>
            <p>Apartment 101</p>
        </div>

        <div class="card">
            <h3>Chores</h3>
            <p>3 pending chores</p>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <p>$120 in shared expenses</p>
        </div>
    </section>


    <section class="card">
        <h2>Upcoming Chores</h2>

        <form id="choreForm">
            <input
                    type="text"
                    id="choreName"
                    placeholder="Enter a new chore"
                    required
            >

            <button type="submit">Add Chore</button>
        </form>

        <ul id="choreList">
            <li>Clean Kitchen</li>
            <li>Take Out Trash</li>
            <li>Vacuum Living Room</li>
        </ul>
    </section>

</main>
<script src="/app.js"></script>
</body>
</html>
